<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jingle Hollow</title>

<style>
:root{--ink:#1c2433;--red:#d23a3a;--green:#2e8a4e;--gold:#f2c443}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1626;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Press Start 2P',monospace;color:var(--ink)}
#game canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}
.box{background:#fdfcf7;border:4px solid var(--ink);border-radius:10px;box-shadow:inset 0 0 0 3px #fdfcf7,inset 0 0 0 6px var(--red),0 6px 0 rgba(0,0,0,.25)}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none;z-index:5}
#bells{display:flex;gap:5px;padding:8px 10px;font-size:10px;align-items:center}
.bell{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#e7e2d4;filter:grayscale(1);opacity:.45;font-size:12px;transition:all .4s}
.bell.on{background:var(--gold);filter:none;opacity:1;transform:scale(1.1)}
#clock{font-size:15px;margin-left:4px;width:20px;text-align:center}
#hudBtns{display:flex;gap:6px;pointer-events:auto}
.hbtn{font-family:inherit;line-height:1;font-size:10px;padding:10px 10px;cursor:pointer;color:var(--ink)}
#banner{position:fixed;top:calc(64px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));padding:12px 16px;font-size:11px;transform:translateX(-130%);transition:transform .35s ease;z-index:5}
#banner.show{transform:none}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(660px,calc(100% - 24px));box-sizing:border-box;padding:18px 18px 24px;font-size:14px;line-height:2;display:none;z-index:6;min-height:96px}
body.touch #dialog{bottom:calc(190px + env(safe-area-inset-bottom))}
#dname{position:absolute;top:-16px;left:14px;background:var(--red);color:#fff;font-size:10px;padding:6px 10px;border:3px solid var(--ink);border-radius:6px;display:none}
#dnext{position:absolute;right:14px;bottom:6px;font-size:10px;color:var(--red);animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
#controls{position:fixed;left:0;right:0;bottom:0;height:190px;pointer-events:none;display:none;z-index:7}
body.touch #controls{display:block}
#dpad{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:auto;touch-action:none}
#dpad .bar{position:absolute;background:rgba(28,36,51,.82);border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#dpad .h{left:0;right:0;top:50px;height:50px}#dpad .v{top:0;bottom:0;left:50px;width:50px}
#dpad .arr{position:absolute;color:rgba(255,255,255,.75);font-size:14px;font-family:sans-serif}
#dpad .hub{position:absolute;left:62px;top:62px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15)}
.rbtn{position:absolute;width:68px;height:68px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;font-family:inherit;font-size:16px;color:#fff;border:4px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none}
#btnA{right:calc(18px + env(safe-area-inset-right));bottom:calc(72px + env(safe-area-inset-bottom));background:var(--red)}
#btnB{right:calc(100px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));background:var(--green);width:58px;height:58px;font-size:13px}
.rbtn.down{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.overlay{position:fixed;inset:0;display:none;place-items:center;z-index:20}
.dim{background:rgba(11,22,38,.55)}
.panel{width:min(560px,calc(100% - 24px));max-height:calc(100% - 60px);overflow:auto;padding:20px 18px;font-size:11px;line-height:1.9;box-sizing:border-box}
.panel h2{font-size:14px;margin:0 0 12px;color:var(--red)}
.panel h3{font-size:11px;margin:16px 0 6px;color:var(--green)}
.q{display:flex;gap:10px;margin:7px 0;align-items:flex-start}.q .ic{flex:0 0 16px}
.q.done{opacity:.5;text-decoration:line-through}
.q.now{color:var(--red)}
.qrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:11px;padding:12px 14px;border:3px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--red);color:#fff}
.btn.on{background:var(--green);color:#fff}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.seg{display:flex;gap:6px}
#mapPanel{width:min(760px,calc(100% - 16px));padding:14px}
#mapCanvas{width:auto;max-width:100%;max-height:calc(100vh - 200px);margin:0 auto;height:auto;display:block;border:3px solid var(--ink);border-radius:6px;image-rendering:pixelated;background:#f4f8fc}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:9px;margin-top:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:5px;border:2px solid var(--ink)}
#title{display:grid;background:radial-gradient(ellipse at 50% 30%,#2a4a7a 0%,#0e1d36 60%,#070f1e 100%);color:#fff;text-align:center;overflow:hidden}
#title h1{font-size:clamp(22px,7vw,48px);margin:0 0 8px;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 0 var(--ink);letter-spacing:2px}
#title p{font-size:11px;opacity:.85;line-height:2;margin:14px 20px 26px}
#title .tbtns{display:flex;flex-direction:column;gap:12px;align-items:center}
#title .btn{min-width:200px;font-size:12px}
.flake{position:absolute;top:-10px;color:#fff;opacity:.8;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
#endBox{text-align:center;padding:26px 20px;width:min(520px,calc(100% - 24px));box-sizing:border-box}
#endBox h2{font-size:clamp(18px,5vw,28px);color:var(--red);margin:0 0 14px;line-height:1.5}
#endBox p{font-size:11px;line-height:2}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;transition:all .3s;font-size:11px;padding:10px 14px;z-index:8;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#choice{background:rgba(11,22,38,.35);z-index:21;align-items:end;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body.touch #choice{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
#choiceBox{display:flex;flex-direction:column;gap:8px;max-width:420px}
.cq{font-size:12px;line-height:1.9;margin-bottom:4px}.cbtn{text-align:left;font-size:11px}.cbtn.sel{background:#ffe9a8}
.bagrow{display:flex;gap:10px;align-items:center;margin:6px 0}.big{font-size:20px;width:28px;text-align:center}
.catlbl{font-size:9px;opacity:.6;margin:10px 0 4px}.clothes{display:flex;flex-direction:column;gap:6px}
.cloth{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid #e2ddd0;border-radius:8px}.cloth.on{border-color:var(--green);background:#eef8ee}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:0 0 18px}.cn{flex:1;font-size:10px}
.btn.mini{font-size:9px;padding:8px 9px}.btn.buy{background:#ffe9a8}.tag{font-size:8px;color:var(--green)}
#codeTxt{width:100%;height:110px;font-family:monospace;font-size:10px;margin-top:10px;box-sizing:border-box;border:3px solid var(--ink);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
#mgHud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:none;justify-content:center;gap:10px;z-index:9;pointer-events:none}
.mgb{padding:10px 14px;font-size:12px}
#mgPop{position:fixed;left:50%;top:32%;transform:translate(-50%,0) scale(.6);opacity:0;font-size:20px;color:#fff;text-shadow:0 3px 0 var(--red),0 6px 0 var(--ink);z-index:9;pointer-events:none;white-space:nowrap}
#mgPop.show{animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
#mgHelp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);padding:18px;font-size:11px;line-height:2.2;text-align:center;z-index:9;display:none}
.keys{font-size:8px;opacity:.6;margin-top:18px;line-height:2}
body.touch .keys{display:none}
@media (max-width:520px){.lbl{display:none}#bells{padding:7px 8px;gap:4px}.bell{width:18px;height:18px;font-size:11px}.hbtn{padding:9px 8px;font-size:9px}}
</style>
</head>

function genVillage(){
  const R=rngSeed(1225);
  const t=new Uint8Array(VW*VH);
  const inb=(x,y)=>x>=0&&y>=0&&x<VW&&y<VH, inner=(x,y)=>x>=2&&y>=2&&x<VW-2&&y<VH-2;
  const set=(x,y,v)=>{if(inb(x,y))t[y*VW+x]=v;}, get=(x,y)=>inb(x,y)?t[y*VW+x]:2;
  const treeish=v=>v===2||v===9||v===10||v===13;
  for(let y=0;y<VH;y++)for(let x=0;x<VW;x++){
    if(!inner(x,y)){set(x,y,2);continue;}
    const r=regionAt(x,y),v=R();
    if(r==='north'||r==='pine'){if(v<0.6)set(x,y,2);}
    else if(r==='candy'){if(v<0.24)set(x,y,9);else if(v<0.38)set(x,y,10);else if(v<0.42)set(x,y,2);}
    else if(r==='lake'){if(v<0.4)set(x,y,2);}
    else if(r==='ski'){if(v<0.3)set(x,y,2);}
    else if(r==='glade'){const edge=(x<22||x>76||y>90)?0.45:0.1;if(v<edge)set(x,y,13);}
  }
  for(let x=33;x<=64;x++)if(R()<0.3)set(x,23,2);
  for(let x=18;x<=80;x++){if(R()<0.35)set(x,70,13);}
  const trails=[
    [[48,24],[48,18],[42,18],[42,12],[48,12],[48,4]],[[42,15],[34,15],[34,8]],[[48,18],[56,18],[56,10],[62,10]],
    [[33,31],[26,31],[26,20],[14,20],[14,12],[8,12]],[[26,31],[26,44],[18,44],[18,56],[8,56],[8,52]],[[18,44],[8,44],[8,36]],[[26,38],[24,38]],
    [[63,31],[70,31],[70,10],[74,10],[78,10]],[[70,24],[86,24],[86,14]],[[86,24],[91,24],[91,32]],[[78,24],[78,5],[90,5]],
    [[63,38],[66,38],[82,38],[82,48],[87,48]],[[66,38],[66,44]],[[76,38],[76,62]],
    [[48,61],[48,76]],[[48,76],[54,76],[54,88],[66,88]],[[54,83],[66,83]],[[48,76],[38,76],[38,79]],[[48,76],[48,90],[30,90],[26,86]],[[38,76],[24,76],[24,74]],[[54,76],[74,76]],[[66,88],[70,88],[70,90]],
  ];
  const fp=[];
  for(const seg of trails)for(let i=0;i<seg.length-1;i++)line(seg[i],seg[i+1],(x,y)=>{set(x,y,1);fp.push([x,y]);});
  for(const [x,y] of fp)for(const [dx,dy] of N8){const nx=x+dx,ny=y+dy,v=get(nx,ny);if(treeish(v)&&inner(nx,ny)&&regionAt(nx,ny)!=='village'&&regionAt(nx,ny)!=='grove'&&R()<0.45)set(nx,ny,0);}
  for(const [cx,cy,r] of [[48,4,2.3],[34,7,2.2],[62,9,2.2],[8,11,2.3],[8,37,2.2],[8,53,1.8],[72,17,2.5],[74,10,1.8],[90,5,1.8],[91,31,1.6],[76,62,2]])
    for(let y=cy-3;y<=cy+3;y++)for(let x=cx-3;x<=cx+3;x++)if(inner(x,y)&&Math.hypot(x-cx,y-cy)<=r&&treeish(get(x,y)))set(x,y,0);
  // castle courtyard
  for(let y=6;y<=17;y++)for(let x=80;x<=92;x++)if(inner(x,y))set(x,y,0);
  // lake + pond
  for(let y=34;y<VH-2;y++)for(let x=62;x<81;x++){const d=Math.hypot(x-LAKE[0],y-LAKE[1]);if(d<=LAKE[2])set(x,y,4);else if(d<=6.3&&inner(x,y)&&treeish(get(x,y)))set(x,y,0);}
  for(let y=78;y<=90;y++)for(let x=30;x<=46;x++){const d=Math.hypot((x-POND[0])/POND[2],(y-POND[1])/POND[3]);if(d<=1)set(x,y,11);else if(d<=1.6&&treeish(get(x,y)))set(x,y,0);}
  // ski hill
  for(let y=52;y<=92;y++)for(let x=86;x<VW-2;x++)set(x,y,12);
  for(let y=42;y<=50;y++)for(let x=82;x<=92;x++)if(inner(x,y)&&get(x,y)!==12)set(x,y,0);
  // village roads
  const P=(x,y)=>set(x,y,1);
  line([48,23],[48,61],P);line([34,31],[63,31],P);line([34,38],[63,38],P);line([34,31],[34,61],P);line([63,31],[63,61],P);
  line([34,45],[63,45],P);line([34,53],[63,53],P);line([34,61],[63,61],P);
  for(let y=31;y<=37;y++)for(let x=45;x<=51;x++)P(x,y);
  // park
  for(let y=62;y<=69;y++)for(let x=33;x<=64;x++)if(treeish(get(x,y)))set(x,y,0);
  line([36,66],[60,66],P);line([48,62],[48,69],P);
  for(const h of HOUSES){
    for(let y=h.y;y<h.y+h.h;y++)for(let x=h.x;x<h.x+h.w;x++)set(x,y,3);
    set(h.doorX,h.doorY,6);
    if(h.road)line([h.doorX,h.doorY+1],[h.doorX,h.road],P);
    else set(h.doorX,h.doorY+1,1);
  }
  set(86,14,1);
  for(let y=33;y<=35;y++)for(let x=47;x<=49;x++)set(x,y,8);
  // secret grove: clear inside, solid ring of trees around
  for(let y=GROVE[1]-6;y<=GROVE[1]+6;y++)for(let x=GROVE[0]-6;x<=GROVE[0]+6;x++){const d=Math.hypot(x-GROVE[0],y-GROVE[1]);if(d<=2.9)set(x,y,0);else if(d<=5.6)set(x,y,2);}
  const reserved=new Set();
  const res=(x,y)=>{reserved.add(x+','+y);if(treeish(get(x,y)))set(x,y,0);};
  ITEMS.forEach(i=>res(i.x,i.y));Object.values(OUT_NPCS).forEach(([x,y])=>res(x,y));
  LAMPS.forEach(([x,y])=>res(x,y));Object.keys(SIGNS).forEach(k=>{const [x,y]=k.split(',').map(Number);res(x,y);});
  const objs=[FIREPIT,STALL,SNOWPILE,...SWING,...SLIDE,...BENCHES];
  [...objs,SLEIGH_PAD,[SLEIGH_PAD[0]+1,SLEIGH_PAD[1]],[SLEIGH_PAD[0],SLEIGH_PAD[1]+1],[SLEIGH_PAD[0]-1,SLEIGH_PAD[1]],[40,66],[50,65],[54,65]].forEach(([x,y])=>res(x,y));
  for(let y=23;y<=69;y++)for(let x=33;x<=64;x++){
    if(get(x,y)!==0||reserved.has(x+','+y))continue;
    let near=false;
    for(const [dx,dy] of N8){const v=get(x+dx,y+dy);if((v!==0&&!treeish(v))||reserved.has((x+dx)+','+(y+dy))){near=true;break;}}
    if(near)continue;
    if(R()<(regionAt(x,y)==='park'?0.12:0.06))set(x,y,2);
  }
  LAMPS.forEach(([x,y])=>set(x,y,5));Object.keys(SIGNS).forEach(k=>{const [x,y]=k.split(',').map(Number);set(x,y,5);});
  objs.forEach(([x,y])=>set(x,y,5));
  // coins on reachable open tiles
  const walk=(x,y)=>{const v=get(x,y);return v===0||v===1;};
  const seen=new Uint8Array(VW*VH),q=[TOWN_START];seen[TOWN_START[1]*VW+TOWN_START[0]]=1;
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of N8.slice(0,4)){const nx=x+dx,ny=y+dy;if(!inb(nx,ny)||seen[ny*VW+nx])continue;const v=get(nx,ny);if(!(v===0||v===1||v===6))continue;seen[ny*VW+nx]=1;if(v!==6)q.push([nx,ny]);}}
  const cand=[];for(let y=2;y<VH-2;y++)for(let x=2;x<VW-2;x++)if(seen[y*VW+x]&&walk(x,y)&&!reserved.has(x+','+y)&&get(x,y)===0&&regionAt(x,y)!=='village')cand.push([x,y]);
  const CR=rngSeed(42);COINS=[];const used=new Set();
  while(COINS.length<45&&cand.length){const i=Math.floor(CR()*cand.length);const [x,y]=cand.splice(i,1)[0];if([...used].some(k=>{const [a,b]=k.split(',').map(Number);return Math.abs(a-x)+Math.abs(b-y)<5;}))continue;used.add(x+','+y);COINS.push([x,y]);}
  return{t,reach:seen};
}

function add(p,geo,mat,x=0,y=0,z=0,shadow=true){const m=new T.Mesh(geo,mat);m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true;}p.add(m);return m;}

function starGeo(R,r,d){const s=new T.Shape();for(let i=0;i<10;i++){const a=i/10*Math.PI*2+Math.PI/2,rad=i%2?r:R,px=Math.cos(a)*rad,py=Math.sin(a)*rad;i?s.lineTo(px,py):s.moveTo(px,py);}s.closePath();const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:1});g.center();return g;}

function makePerson(o){

  const legs=[],arms=[];
  for(const s of[-1,1]){const l=new T.Group();l.position.set(s*.085,.3,0);add(l,BOX(.12,.26,.13),M(o.legs||'#c8343a'),0,-.13,0);add(l,BOX(.14,.09,.2),M(o.boots||'#3a2418'),0,-.25,.03);g.add(l);legs.push(l);}
  add(g,CYL(.17,.24,.44,10),bodyM,0,.5,0);
  if(o.trim)add(g,CYL(.245,.25,.07,10),M('#ffffff'),0,.3,0);
  if(o.belt){add(g,CYL(.215,.225,.07,10),M('#1f1f1f'),0,.4,0);add(g,BOX(.09,.08,.05),M('#f2c443',{metalness:.6,roughness:.3}),0,.4,.22);}
  if(o.apron)add(g,BOX(.3,.36,.03),M(o.apron),0,.45,.2);
  if(o.stripes)for(const y of[.36,.5,.64])add(g,CYL(.2+(.64-y)*.12,.205+(.64-y)*.12,.05,10),M(o.stripes),0,y,0);
  if(o.buttons)for(const y of[.48,.58])add(g,SPH(.025,6,4),M(o.buttons),0,y,.2);
  for(const s of[-1,1]){const a=new T.Group();a.position.set(s*.22,.68,0);add(a,BOX(.09,.3,.1),bodyM,0,-.14,0);add(a,SPH(.06,6,5),M(o.gloves||o.skin||'#f2c7a0'),0,-.31,0);a.rotation.z=s*.12;g.add(a);arms.push(a);}
  const head=new T.Group();head.position.y=.92;g.add(head);
  add(head,SPH(.2,14,12),skin);
  for(const s of[-1,1]){add(head,SPH(.028,6,5),M('#161616'),s*.075,.03,.175,false);add(head,SPH(.04,6,5),M('#ff9a9a',{roughness:1}),s*.12,-.04,.15,false);}
  add(head,SPH(.035,6,5),M(o.nose||'#f0a890'),0,-.02,.2,false);
  if(o.ears)for(const s of[-1,1]){const e=add(head,CONE(.055,.2,5),skin,s*.21,.04,0);e.rotation.z=-s*1.3;}
  if(o.hair){const h=add(head,new T.SphereGeometry(.212,14,10,0,Math.PI*2,0,Math.PI*.5),M(o.hair),0,.01,-.025);h.rotation.x=-.35;}
  if(o.bun)add(head,SPH(.1,8,6),M(o.hair),0,.15,-.15);
  if(o.glasses)for(const s of[-1,1])add(head,new T.TorusGeometry(.05,.01,5,12),M('#333'),s*.075,.03,.19,false);
  if(o.beard){const b=add(head,SPH(.18,10,8),M(o.beardColor||'#f6f6f6'),0,-.13,.08);b.scale.set(1.05,1.15,.72);add(head,BOX(.2,.05,.06),M(o.beardColor||'#f6f6f6'),0,-.05,.19);}
  let hat=null;
  if(o.hat==='elf'||o.hat==='santa'){
    const hc=o.hatMat||(o.hatColor==='gold'?M('#f2c443',{metalness:.7,roughness:.3}):M(o.hatColor||'#d23a3a'));hat=add(head,CONE(.2,.46,10),hc,0,.32,-.05);hat.rotation.x=-.32;
    add(head,SPH(.055,6,5),M('#ffffff'),0,.52,-.18);

}

function plankTex(base){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const b=new T.Color(base);
  for(let i=0;i<8;i++){const cc=b.clone().offsetHSL(0,0,(Math.sin(i*12.9)*.5)*.06);x.fillStyle='#'+cc.getHexString();x.fillRect(0,i*32,256,32);x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,i*32+30,256,2);const off=(i*97)%256;x.fillRect(off,i*32,2,32);x.fillRect((off+128)%256,i*32,2,32);}
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t;}

  Object.assign(dl.shadow.camera,{left:-9,right:9,top:9,bottom:-9});dl.shadow.bias=-.0008;sc.add(dl,dl.target);

  add(sc,BOX(d.w,2.1,1),wm,(d.w-1)/2,1.05,0);add(sc,BOX(d.w,.5,1.02),tm,(d.w-1)/2,.25,0);add(sc,BOX(d.w,.1,1.06),tm,(d.w-1)/2,2.1,0);

  for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++)if(y===0||x===0||x===d.w-1||(y===d.h-1&&(par||x!==dx)))m.solid[y*d.w+x]=1;

const nightness=()=>{const t=S.tod;return t<.5?0:t<.6?(t-.5)/.1:t<.92?1:1-(t-.92)/.08;};

function startQ(k,msg){return()=>{S.q[k].st=1;toast('New quest: '+(QUESTS[k]?QUESTS[k].title:msg));sfx.pick();save();};}
function completeQ(k){return()=>{const Q=QUESTS[k];S.q[k].st=2;
  if(Q&&Q.bell){S.bells++;sfx.bell();updateHUD();updateTree();toast('You got a bell! '+S.bells+' of 4');}
  else{sfx.bell();toast('Quest done! ★');}
  S.coins=(S.coins||0)+15;setTimeout(()=>toast('+15 coins!'),1300);
  const RW={gems:'crown',feathers:'starhat',flowers:'flowercrown'};if(RW[k])S.owned[RW[k]]=true;
  doAct('cheer');updateWorld();save();setTimeout(checkSuper,600);};}
function allDone(){return S.starPlaced&&S.q.gifts.st===2&&Object.keys(QUESTS).every(k=>S.q[k].st===2);}
function checkSuper(){if(S.superElf||!allDone())return;S.superElf=true;S.owned.goldhat=true;S.outfit.hat='goldhat';rebuildPlayer();save();

function nextHint(){for(const k of['ornaments','toys','cookies','carrots'])if(S.q[k].st!==2)return QUESTS[k].where;return'';}

function updateFlight(dt){

    const l=Math.hypot(ix,iz);if(l>0){ix/=l;iz/=l;}
    const sp=7.5;f.vx+=(ix*sp-f.vx)*Math.min(1,dt*2.2);f.vz+=(iz*sp-f.vz)*Math.min(1,dt*2.2);
    f.x=Math.max(-2,Math.min(VW+1,f.x+f.vx*dt));f.z=Math.max(-2,Math.min(VH+1,f.z+f.vz*dt));

  const spd=Math.hypot(f.vx,f.vz);
  if(spd>.4&&f.phase!=='down'){let want=Math.atan2(f.vx,f.vz),d=want-f.head;d=Math.atan2(Math.sin(d),Math.cos(d));f.head+=d*Math.min(1,dt*4);flySleigh.rotation.z=-d*.35;}

  flySleigh.userData.deer.forEach((d,i)=>{d.userData.quad.forEach((l,j)=>l.rotation.x=Math.sin(f.t*10+i+j*1.6)*.7);d.position.y=Math.sin(f.t*10+i)*.05;});

}

/* ============================== STATIC MESH BAKING (performance) ============================== */
function mergeGeoList(list,needColor,needUV){
  let n=0;for(const g of list)n+=g.attributes.position.count;
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=needColor?new Float32Array(n*3):null,uv=needUV?new Float32Array(n*2):null;let o=0;
  for(const g of list){const c=g.attributes.position.count;pos.set(g.attributes.position.array,o*3);if(g.attributes.normal)nor.set(g.attributes.normal.array,o*3);
    if(col){if(g.attributes.color)col.set(g.attributes.color.array,o*3);else col.fill(1,o*3,(o+c)*3);}
    if(uv&&g.attributes.uv)uv.set(g.attributes.uv.array,o*2);o+=c;}
  const m=new T.BufferGeometry();m.setAttribute('position',new T.BufferAttribute(pos,3));m.setAttribute('normal',new T.BufferAttribute(nor,3));if(col)m.setAttribute('color',new T.BufferAttribute(col,3));if(uv)m.setAttribute('uv',new T.BufferAttribute(uv,2));
  m.computeBoundingSphere();return m;
}
function isDyn(o){while(o){if(o.userData&&o.userData.dyn)return true;o=o.parent;}return false;}
function bakeStatic(scene,chunk){
  scene.updateMatrixWorld(true);const groups=new Map(),kill=[];const v=new T.Vector3();
  scene.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||o.isSkinnedMesh||Array.isArray(o.material)||o.children.length||isDyn(o))return;
    o.getWorldPosition(v);const ck=chunk?Math.floor(v.x/chunk)+','+Math.floor(v.z/chunk):'0';const key=o.material.uuid+'|'+o.castShadow+'|'+o.receiveShadow+'|'+ck;
    let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);
    if(!groups.has(key))groups.set(key,{mat:o.material,cs:o.castShadow,rs:o.receiveShadow,list:[]});groups.get(key).list.push(g);kill.push(o);});
  kill.forEach(o=>o.parent.remove(o));
  for(const {mat,cs,rs,list} of groups.values()){const m=new T.Mesh(mergeGeoList(list,!!mat.vertexColors,!!mat.map),mat);m.castShadow=cs;m.receiveShadow=rs;scene.add(m);}
}
function bakeLocal(root){
  const visit=grp=>{const by=new Map(),kill=[];
    for(const c of grp.children){if(c.isMesh&&!c.isInstancedMesh&&!c.children.length&&!(c.userData&&c.userData.dyn)&&!Array.isArray(c.material)){c.updateMatrix();
      const k=c.material.uuid+'|'+c.castShadow;let g=c.geometry.index?c.geometry.toNonIndexed():c.geometry.clone();g.applyMatrix4(c.matrix);
      if(!by.has(k))by.set(k,{mat:c.material,cs:c.castShadow,rs:c.receiveShadow,list:[]});by.get(k).list.push(g);kill.push(c);}}
    for(const c of grp.children)if(!c.isMesh||c.children.length)visit(c);
    kill.forEach(c=>grp.remove(c));
    for(const {mat,cs,rs,list} of by.values()){const m=new T.Mesh(mergeGeoList(list,!!mat.vertexColors,!!mat.map),mat);m.castShadow=cs;m.receiveShadow=rs;grp.add(m);}};
  visit(root);return root;
}

  const items=[];
  for(const k in BAG_ICONS){const q=S.q[k];if(q&&q.st===1&&q.n>0)items.push(`<div class="bagrow"><span class="big">${BAG_ICONS[k][0]}</span><span>${BAG_ICONS[k][1]}: <b>${q.n}</b></span></div>`);}
  if(S.q.friend.st===1){if(S.collected.hat)items.push('<div class="bagrow"><span class="big">🎩</span><span>Snowman hat</span></div>');if(S.collected.scarf)items.push('<div class="bagrow"><span class="big">🧣</span><span>Snowman scarf</span></div>');if(S.collected.btn)items.push('<div class="bagrow"><span class="big">🔘</span><span>Snowman buttons</span></div>');}
  if(S.hasStar)items.push('<div class="bagrow"><span class="big">⭐</span><span><b>The Christmas Star!</b></span></div>');
  if(S.q.cookies.st===1&&!S.cookiesDelivered)items.push('<div class="bagrow"><span class="big">🍪</span><span>Cookies for Flurry</span></div>');
  if(S.q.gifts.st===1)items.push(`<div class="bagrow"><span class="big">🛍</span><span>Gift bag: <b>${TOTAL_GIFTS-giftCount()} gifts left</b></span></div>`);
  if(S.sleigh)items.push('<div class="bagrow"><span class="big">🛷</span><span>Santa\'s sleigh key (fly at night!)</span></div>');
  h+='<h3>THINGS YOU HAVE</h3>'+(items.length?items.join(''):'<div class="bagrow">Nothing yet. Go help your friends!</div>');
  h+='<h3>👕 YOUR CLOTHES</h3>';
  for(const cat in CLOTHES){const own=CLOTHES[cat].filter(c=>owns(cat,c));h+=`<div class="catlbl">${CAT_NAMES[cat]}</div><div class="clothes">`+own.map(c=>clothBtn(cat,c,false)).join('')+'</div>';}
  h+='<div class="qrow"><button class="btn primary" id="bagClose">CLOSE</button></div>';
  $('bagBox').innerHTML=h;$('bagClose').onclick=closeAll;bindCloth($('bagBox'),renderBag);
}
function swatch(c){if(!c)return'<span class="sw" style="background:repeating-linear-gradient(45deg,#ddd 0 4px,#fff 4px 8px)"></span>';if(c==='gold')c='#f2c443';return`<span class="sw" style="background:${c}"></span>`;}
function clothBtn(cat,c,shop){const wearing=S.outfit[cat]===c.id,own=owns(cat,c);
  let act=wearing?'<span class="tag">WEARING</span>':own?`<button class="btn mini" data-wear="${cat}:${c.id}">WEAR</button>`:`<button class="btn mini buy" data-buy="${cat}:${c.id}">BUY ${c.p}🪙</button>`;
  return`<div class="cloth ${wearing?'on':''}">${swatch(c.c)}<span class="cn">${c.name}</span>${act}</div>`;}
function bindCloth(root,rerender){
  root.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{const [cat,id]=b.dataset.wear.split(':');wear(cat,id);rerender();});
  root.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const [cat,id]=b.dataset.buy.split(':');const c=findCloth(cat,id);
    if(S.coins<c.p){toast('Not enough coins! Find more coins.');tone(200,.15,'square',.04);return;}
    S.coins-=c.p;S.owned[id]=true;wear(cat,id);toast(`You got the ${c.name}!`);rerender();});}

/* ============================== ACTIONS (character animations) ============================== */
const HEART=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#ff3a6a';x.beginPath();x.moveTo(32,56);x.bezierCurveTo(4,36,6,10,22,10);x.bezierCurveTo(28,10,32,16,32,20);x.bezierCurveTo(32,16,36,10,42,10);x.bezierCurveTo(58,10,60,36,32,56);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();return new T.CanvasTexture(c);})();
const emote=new T.Sprite(new T.SpriteMaterial({map:HEART,transparent:true,depthTest:false}));emote.scale.set(.4,.4,1);emote.renderOrder=11;emote.visible=false;
const steam=[0,1,2].map(()=>{const s=glow('#ffffff',.18,.5);s.visible=false;return s;});
const ACT_LEN={wave:.7,cheer:.9,drink:3,eat:3,sit:1.6};
function doAct(type,item){
  if(player.act&&player.act.item)player.act.item.parent&&player.act.item.parent.remove(player.act.item);
  const a={type,t:0,dur:ACT_LEN[type]||1,lock:type!=='wave',item:null};
  if(type==='drink'||type==='eat'){const it=makeFood(item||'cocoa');a.item=it;const arm=player.model.userData.arms[0];arm.add(it);it.position.set(0,-.34,.07);it.scale.setScalar(type==='eat'?.9:1.1);
    if(type==='eat')it.rotation.x=Math.PI/2;}
  player.act=a;
}
function updateAct(dt){
  const a=player.act,u=player.model.userData;if(!a){emote.visible=false;steam.forEach(s=>s.visible=false);return;}
  a.t+=dt;const k=a.t/a.dur,sc=curMap.scene;
  if(emote.parent!==sc)sc.add(emote);steam.forEach(s=>{if(s.parent!==sc)sc.add(s);});
  const pp=player.model.position;
  if(a.type==='wave'){u.arms[1].rotation.x=-2.6;u.arms[1].rotation.z=Math.sin(a.t*16)*.4+.3;}
  if(a.type==='cheer'){const j=Math.sin(Math.min(1,k)*Math.PI);player.model.position.y=j*.35;u.arms.forEach((ar,i)=>{ar.rotation.x=-2.9;ar.rotation.z=(i?-1:1)*.4;});}
  if(a.type==='sit'){player.model.position.y=-.15*Math.sin(Math.min(1,k)*Math.PI);u.legs.forEach(l=>l.rotation.x=-1.2*Math.sin(Math.min(1,k)*Math.PI));}
  if(a.type==='drink'||a.type==='eat'){
    const lift=k<.15?k/.15:k>.85?(1-k)/.15:1;const sip=Math.sin(a.t*(a.type==='eat'?9:5))*.12;
    u.arms[0].rotation.x=-2.15*lift+sip*lift;u.arms[0].rotation.z=.15;u.head.rotation.x=-.25*lift+(a.type==='eat'?Math.abs(sip):0);
    if(a.type==='drink'){const wp=new T.Vector3();a.item.getWorldPosition(wp);steam.forEach((s,i)=>{s.visible=true;const t=(a.t*.8+i/3)%1;s.position.set(wp.x+Math.sin(t*6+i)*.05,wp.y+.12+t*.45,wp.z);s.material.opacity=.5*(1-t);s.scale.setScalar(.12+t*.2);});}
    if(k>.7){emote.visible=true;emote.position.set(pp.x,pp.y+1.55+(k-.7)*.8,pp.z);emote.material.opacity=Math.min(1,(1-k)*4);}
  }
  if(a.t>=a.dur){if(a.item&&a.item.parent)a.item.parent.remove(a.item);u.arms.forEach(ar=>{ar.rotation.x=0;ar.rotation.z=(ar===u.arms[0]?-1:1)*.12;});u.head.rotation.x=0;player.model.position.y=0;u.legs.forEach(l=>l.rotation.x=0);
    const was=a.type;player.act=null;emote.visible=false;steam.forEach(s=>s.visible=false);
    if(was==='drink')toast('Yum! So warm! ❤');if(was==='eat')toast('Yum, yum! So good! ❤');}
}
function idleAnim(g,moving,dt){const u=g.userData;if(moving||player.act||!u.head)return;u.head.rotation.y=Math.sin(time*.6)*.35*Math.max(0,Math.sin(time*.23));g.position.y=Math.sin(time*2.2)*.008;}

/* ============================== PARK RIDES ============================== */
function startRide(type){
  if(type==='swing'){player.ride={type,t:0,amp:0,seat:0};player.dir='down';toast(isTouch?'Wheee! Press A to get off.':'Wheee! Press SPACE to get off.');}
  if(type==='slide'){player.ride={type,t:0};}
  sfx.blip();
}
function updateRide(dt){
  const r=player.ride;if(!r)return;const u=player.model.userData,m=player.model;r.t+=dt;
  if(r.type==='swing'){r.amp=Math.min(.95,r.amp+dt*.25);const th=Math.sin(r.t*2.4)*r.amp;const seat=maps.village.swing.userData.seats[0];seat.rotation.x=th;
    const px=40-.5,py=1.95,pz=65;m.position.set(px,py-1.45*Math.cos(th)-.02,pz+1.45*Math.sin(th));m.rotation.set(th,0,0);
    u.legs.forEach(l=>l.rotation.x=-1.4+Math.sin(r.t*2.4)*.4);u.arms.forEach(a=>a.rotation.x=-2.8);
    if(Math.abs(Math.sin(r.t*2.4))>.98&&r.amp>.5&&!r.wee){r.wee=1;tone(880,.1,'sine',.03);}else if(Math.abs(Math.sin(r.t*2.4))<.5)r.wee=0;}
  if(r.type==='slide'){const t=r.t;
    if(t<.9){const k=t/.9;m.position.set(51,k*1.8,65.25);m.rotation.set(0,Math.PI,0);u.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*14+i*3)*.6);u.arms.forEach((a,i)=>a.rotation.x=-2.6+Math.sin(t*14+i*3)*.4);}
    else if(t<1.2){m.position.set(51,1.85,65);m.rotation.set(0,Math.PI/2,0);u.legs.forEach(l=>l.rotation.x=-1.4);u.arms.forEach(a=>a.rotation.x=-2.8);}
    else if(t<2.1){const k=(t-1.2)/.9;m.position.set(51.2+k*2.1,1.75-k*1.55,65);m.rotation.set(0,Math.PI/2,-.6);if(!r.w){r.w=1;[660,880,1046,1318].forEach((f,i)=>tone(f,.15,'sine',.04,i*.12));}}
    else if(t<2.5){const k=(t-2.1)/.4;m.position.set(53.3+k*.7,.2*(1-k),65);m.rotation.set(0,Math.PI/2,0);u.legs.forEach(l=>l.rotation.x=-1.4*(1-k));u.arms.forEach(a=>a.rotation.x=-2.8*(1-k));}
    else{endRide();}}
}
function endRide(){
  const r=player.ride;if(!r)return;if(r.type==='slide'&&r.t<2.5)return;
  const m=player.model,u=m.userData;m.rotation.set(0,0,0);u.legs.forEach(l=>l.rotation.x=0);u.arms.forEach(a=>a.rotation.x=0);
  if(r.type==='swing'){maps.village.swing.userData.seats[0].rotation.x=0;player.x=40;player.y=66;player.dir='down';}
  if(r.type==='slide'){player.x=54;player.y=65;player.dir='right';doAct('cheer');}
  player.ride=null;m.position.set(player.x,0,player.y);player.rot=dirRot(player.dir);m.rotation.y=player.rot;
}

function mgInput(){let ix=0,iy=0;if(touchVec){ix=touchVec[0];iy=touchVec[1];}else for(const d of held){ix+=DIRS[d][0];iy+=DIRS[d][1];}return[ix,iy];}

const SKATE={
  init(){

    if(!this.stars){this.stars=[];for(let i=0;i<3;i++){const s=new T.Group();s.userData.dyn=true;add(s,starGeo(.3,.13,.08),E('#ffd54a',1.6),0,.5,0,false);s.add(glow('#ffe08a',1.4,.7));m.scene.add(s);this.stars.push(s);}}

    MG.time=45;this.x=this.cx;this.z=this.cz+2.2;this.h=-Math.PI/2;this.v=2;this.air=0;this.spinT=0;this.combo=0;this.comboT=0;

    const u=player.model.userData;u.arms.forEach(a=>{a.rotation.x=0;a.rotation.z=(a===u.arms[0]?-1:1)*.12;});u.legs.forEach(l=>l.rotation.x=0);player.model.position.y=0;
  },
  placeStar(s){for(let k=0;k<30;k++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*this.R*.85;const x=this.cx+Math.cos(a)*r,z=this.cz+Math.sin(a)*r;
    if(Math.hypot(x-this.x,z-this.z)>2.2){s.position.set(x,0,z);return;}}},
  jump(){if(this.air>0||MG.ended)return;this.air=.001;this.jumpSpin=this.spinT>0;this.spinT=0;tone(523,.1,'triangle',.05);},
  spin(){if(this.spinT>0||this.air>0||MG.ended)return;this.spinT=.001;tone(784,.1,'triangle',.05);},
  score(pts,label){this.combo++;this.comboT=2.5;const bonus=this.combo>1?(this.combo-1)*10:0;MG.score+=pts+bonus;MG.pop(label+' +'+(pts+bonus)+(this.combo>1?'  x'+this.combo:''));},
  update(dt){

    const [ix,iy]=mgInput(),il=Math.hypot(ix,iy);
    if(il>.1&&!MG.ended){const want=Math.atan2(iy,ix);let d=want-this.h;d=Math.atan2(Math.sin(d),Math.cos(d));this.h+=d*Math.min(1,dt*(this.air>0?2:5));this.v+=(4.2-this.v)*Math.min(1,dt*1.5);}
    else this.v+=((MG.ended?0:1.6)-this.v)*Math.min(1,dt*.8);
    this.x+=Math.cos(this.h)*this.v*dt;this.z+=Math.sin(this.h)*this.v*dt;

    if(d>this.R){const nx=dx/d,nz=dz/d,vx=Math.cos(this.h),vz=Math.sin(this.h),dot=vx*nx+vz*nz;
      if(dot>0){this.h=Math.atan2(vz-2*dot*nz,vx-2*dot*nx);this.v*=.75;tone(150,.06,'square',.03);}
      this.x=this.cx+nx*this.R;this.z=this.cz+nz*this.R;}
    let y=0,extra=0;
    if(this.air>0){this.air+=dt;const T2=.75,k=Math.min(1,this.air/T2);y=Math.sin(k*Math.PI)*.9;extra=k*Math.PI*2*(this.jumpSpin?2:1);
      u.arms.forEach((a,i)=>{a.rotation.x=0;a.rotation.z=(i?-1:1)*-.2;});u.legs.forEach((l,i)=>l.rotation.x=i?-.6:.2);
      if(this.air>=T2){this.air=0;if(!MG.ended){this.score(this.jumpSpin?200:100,this.jumpSpin?'SPIN JUMP!':'JUMP!');[523,659,784].forEach((f,i)=>tone(f,.1,'square',.03,i*.06));}}}
    else if(this.spinT>0){this.spinT+=dt;const T3=1.2;extra=Math.min(1,this.spinT/T3)*Math.PI*6;u.arms.forEach(a=>{a.rotation.x=-3;a.rotation.z=0;});u.legs.forEach((l,i)=>l.rotation.x=i?-.4:0);
      if(this.spinT>=T3){this.spinT=0;if(!MG.ended){this.score(50,'SPIN!');[659,784].forEach((f,i)=>tone(f,.1,'square',.03,i*.06));}}}
    else{const s=Math.sin(time*5)*Math.min(1,this.v/3);u.legs.forEach((l,i)=>l.rotation.x=(i?1:-1)*s*.5);u.arms.forEach((a,i)=>{a.rotation.x=(i?-1:1)*s*.3;a.rotation.z=(i?-1:1)*.6;});}
    p.position.set(this.x,y,this.z);p.rotation.set(0,Math.PI/2-this.h+extra,0);player.rot=p.rotation.y;
    for(const s of this.stars){s.rotation.y+=dt*2;s.children[0].position.y=.5+Math.sin(time*3)*.1;
      if(!MG.ended&&Math.hypot(s.position.x-this.x,s.position.z-this.z)<.8){MG.score+=25;MG.pop('STAR! +25');sfx.pick();this.placeStar(s);}}
    MG.help>0&&(MG.help-=dt,MG.help<=0&&($('mgHelp').style.display='none'));
    MG.updHud();
  }
};

const SKI={
  init(){
    const m=maps.village;
    if(!this.coins){this.coins=[];for(let i=0;i<9;i++){const c=new T.Group();c.userData.dyn=true;add(c,CYL(.2,.2,.05,14),M('#f2c443',{metalness:.7,roughness:.25}),0,0,0,false).rotation.x=Math.PI/2;c.add(glow('#ffd23a',.8,.6));c.visible=false;m.scene.add(c);this.coins.push(c);}}
    setMap(m,87,48,'up');$('banner').classList.remove('show');player.act=null;
    this.gear=[];const u=player.model.userData;u.legs.forEach(l=>this.gear.push(add(l,BOX(.07,.03,.9),M('#e8243a'),0,-.31,.12,false)));u.arms.forEach(a=>this.gear.push(add(a,CYL(.012,.012,.8,4),M('#888'),0,-.35,0,false)));
    if(!this.chair){const c=new T.Group();c.userData.dyn=true;add(c,CYL(.012,.012,.6,4),M('#333'),0,.3,0,false);add(c,BOX(.5,.05,.45),M('#e8243a'),0,0,0);add(c,BOX(.5,.4,.05),M('#e8243a'),0,.18,-.22);add(c,BOX(.05,.05,.5),M('#333'),.24,.12,0);m.scene.add(c);this.chair=c;}
    this.chair.visible=true;this.runs=0;this.lt=0;this.top();this.phase='lift';snapCam=true;
  },
  top(){this.x=89.85;this.z=91.2;this.v=2;this.vx=0;this.air=0;this.crash=0;this.brake=0;this.lift=0;this.gates=new Set();this.ramps=new Set();
    this.coins.forEach(c=>{c.visible=true;c.got=false;for(let k=0;k<20;k++){const x=HILL.x0+.8+Math.random()*(HILL.x1-HILL.x0-1.6),z=55+Math.random()*34;if(!SKI_TREES.some(([tx,tz])=>Math.hypot(tx-x,tz-z)<1.2)){c.position.set(x,hillY(z)+.5,z);break;}}});snapCam=true;},
  cleanup(){if(this.chair)this.chair.visible=false;(this.gear||[]).forEach(g=>g.parent&&g.parent.remove(g));this.gear=[];if(this.coins)this.coins.forEach(c=>c.visible=false);
    const u=player.model.userData;u.legs.forEach(l=>l.rotation.x=0);u.arms.forEach(a=>{a.rotation.x=0;a.rotation.z=(a===u.arms[0]?-1:1)*.12;});player.model.rotation.set(0,player.rot,0);player.model.position.y=0;},
  jump(){if(this.phase!=='ski'||this.air>0||this.crash>0||MG.ended)return;this.air=.001;this.airLen=.55;tone(440,.1,'triangle',.05);},
  update(dt){
    const p=player.model,u=p.userData;
    if(MG.help>0){MG.help-=dt;if(MG.help<=0)$('mgHelp').style.display='none';}
    if(this.phase==='lift'){this.lt+=dt/7;const k=Math.min(1,this.lt),z=52+38.5*k,x=HILL.x1-.1+.35,cy=hillY(z)+1.75;
      this.chair.position.set(x,cy,z);this.chair.rotation.y=0;p.position.set(x,cy+.02,z-.05);p.rotation.set(0,0,0);player.rot=0;
      u.legs.forEach(l=>l.rotation.x=-1.4+Math.sin(time*3)*.15);u.arms.forEach((a,i)=>{a.rotation.x=-.3;a.rotation.z=(i?-1:1)*.2;});
      if(k>=1){this.phase='ski';this.chair.visible=false;MG.pop('GO! Ski down!');[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.04,i*.08));}
      MG.updHud();return;}
    const [ix]=mgInput();
    if(this.crash>0){this.crash-=dt;this.v=Math.max(.5,this.v*.94);p.rotation.z=Math.sin(this.crash*20)*.6;}
    else if(!MG.ended){const target=this.brake>0?3:Math.min(10,4+(91.2-this.z)*.15);if(this.brake>0)this.brake-=dt;this.v+=(target-this.v)*dt*.9;this.vx+=(ix*6-this.vx)*Math.min(1,dt*5);}
    else{this.v*=.95;this.vx*=.9;}
    this.x=Math.max(HILL.x0+.4,Math.min(HILL.x1-.4,this.x+this.vx*dt));this.z-=this.v*dt;
    let jy=0;
    if(this.air>0){this.air+=dt;jy=Math.sin(Math.min(1,this.air/this.airLen)*Math.PI)*(this.airLen>.7?1.4:.6);if(this.air>=this.airLen){this.air=0;if(this.airLen>.7&&!MG.ended){MG.score+=30;MG.pop('BIG JUMP! +30');}}}
    if(!MG.ended&&this.crash<=0){
      for(const [tx,tz] of SKI_TREES)if(Math.abs(tz-this.z)<.5&&Math.abs(tx-this.x)<.6&&jy<.45){this.crash=1;this.v=1;MG.pop('OOPS! Bonk!');tone(110,.25,'square',.05);break;}
      SKI_RAMPS.forEach(([rx,rz],i)=>{if(!this.ramps.has(i)&&Math.abs(rz-this.z)<.5&&Math.abs(rx-this.x)<.8&&this.air<=0){this.ramps.add(i);this.air=.001;this.airLen=1;tone(523,.15,'triangle',.05);}});
      SKI_GATES.forEach(([gx,gz],i)=>{if(!this.gates.has(i)&&this.z<=gz){this.gates.add(i);if(Math.abs(this.x-gx)<1.2){MG.score+=50;MG.pop('FLAG! +50');[659,880].forEach((f,j)=>tone(f,.1,'square',.03,j*.07));}else MG.pop('Missed a flag');}});
      for(const c of this.coins)if(c.visible&&Math.abs(c.position.z-this.z)<.6&&Math.abs(c.position.x-this.x)<.7){c.visible=false;MG.score+=10;MG.pop('COIN! +10');tone(1568,.08,'square',.03);}
    }
    if(this.crash<=0){p.rotation.z=0;u.legs.forEach(l=>l.rotation.x=-.5);u.arms.forEach((a,i)=>{a.rotation.x=-.6;a.rotation.z=(i?-1:1)*.3;});}
    p.position.set(this.x,hillY(this.z)+jy,this.z);p.rotation.y=Math.PI-this.vx*.06;p.rotation.x=this.crash>0?0:-.15;player.rot=Math.PI;
    for(const c of this.coins)if(c.visible)c.rotation.y+=dt*3;
    if(this.z<=HILL.z0+1.2&&this.phase==='ski'){this.runs++;this.phase='done';MG.score+=100;MG.pop('FINISH! +100');MG.finish();}
    if(this.z<=HILL.z0+.6){this.z=HILL.z0+.6;this.v=0;}
    MG.updHud();
  }
};

/* ============================== CLOUD SAVE ============================== */
let cloudDirty=false,cloudBusy=false,cloudRef=null,cloudOK=false,cloudLast=0,cloudData=null,cloudErr=false;
async function cloudInit(){
  try{if(!window.claude||typeof claude.use!=='function')return;
    const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
    const id=await user.id();if(!id)return;cloudRef=db.doc('data/users/'+id+'/save');
    const snap=await cloudRef.get();cloudOK=true;
    if(snap.exists){const d=snap.data();if(d&&typeof d.s==='string'){try{cloudData=JSON.parse(d.s);}catch(e){}}}
    if(cloudData&&!started)$('btnCont').style.display='block';
  }catch(e){cloudErr=true;}
}
async function cloudSave(force){
  if(!cloudRef||cloudBusy)return;if(!force&&!cloudDirty)return;cloudBusy=true;cloudDirty=false;
  try{await cloudRef.set({s:JSON.stringify(S),t:Date.now()});cloudLast=Date.now();cloudErr=false;}catch(e){cloudErr=true;cloudDirty=true;}
  cloudBusy=false;
}
setInterval(()=>{if(started&&cloudDirty)cloudSave(false);},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started){save();cloudSave(true);}});
function saveInfoText(just){
  const t=new Date(S.t||Date.now());const hm=t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  let s=`✓ Saved on this device (${hm}).`;
  if(cloudOK&&!cloudErr)s+=` ✓ Saved to your Claude account too, so it works on your other devices.`;
  else s+=' Your game also saves by itself. For extra safety, tap SAVE CODE and keep the code.';
  return just?'Game saved! '+s:s;
}
function encodeSave(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function showSaveCode(){closeAll();menuOpen='code';const b=$('codeBox');
  b.innerHTML='<h2>💾 SAVE CODE</h2><div style="font-size:10px;line-height:1.9">This code is your whole game. Copy it and keep it in a note. Paste it into LOAD CODE any time.</div><textarea id="codeTxt" readonly></textarea><div class="qrow"><button class="btn on" id="codeCopy">COPY</button><button class="btn primary" id="codeClose">CLOSE</button></div>';
  $('codeTxt').value=encodeSave();$('codeOv').style.display='grid';
  $('codeCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('codeTxt').value);toast('Copied!');}catch(e){$('codeTxt').select();toast('Press and hold to copy.');}};
  $('codeClose').onclick=closeAll;}
function showLoadCode(){closeAll();menuOpen='code';const b=$('codeBox');
  b.innerHTML='<h2>📂 LOAD CODE</h2><div style="font-size:10px;line-height:1.9">Paste your save code here.</div><textarea id="codeTxt" placeholder="Paste code here"></textarea><div class="qrow"><button class="btn on" id="codeLoad">LOAD GAME</button><button class="btn primary" id="codeClose">CLOSE</button></div>';
  $('codeOv').style.display='grid';$('codeClose').onclick=closeAll;
  $('codeLoad').onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob($('codeTxt').value.trim()))));if(!s||!s.q)throw 0;applySave(s);closeAll();toast('Game loaded!');save();}catch(e){toast('That code did not work.');}};}
function migrate(s){if(!s.ver){if(s.map==='village')s.x+=16;delete s.sleighAt;s.ver=3;}return s;}
function applySave(s){
  s=migrate(s);const f=freshState();S=Object.assign(f,s);S.q=Object.assign(freshState().q,s.q||{});S.owned=Object.assign(freshState().owned,s.owned||{});S.best=Object.assign({skate:0,ski:0},s.best||{});
  if(!s.outfit||!CLOTHES.hat.some(c=>c.id===s.outfit.hat))S.outfit=freshState().outfit;
  if(S.superElf)S.owned.goldhat=true;
  if(flight.on){flight.on=false;flySleigh.visible=false;}player.ride=null;player.act=null;
  const m=maps[S.map]||maps.village;
  const v=maps.village;if(!S.sleighAt||!(v.reach[S.sleighAt[1]*VW+S.sleighAt[0]]||regionAt(S.sleighAt[0],S.sleighAt[1])==='grove'))S.sleighAt=SLEIGH_PAD.slice();
  if(walkable(m,S.x,S.y)&&!(m===v&&S.sleighAt[0]===S.x&&S.sleighAt[1]===S.y))setMap(m,S.x,S.y,S.dir||'down');else setMap(maps[START.map],START.x,START.y,START.dir);
  updateWorld();applyTime();
}

/* ============================== BOOT ============================== */
buildVillage();for(const k in INTERIORS)buildInterior(k);
for(const k in maps)bakeStatic(maps[k].scene,maps[k].outdoor?16:0);
setMap(maps[START.map],START.x,START.y,START.dir);$('banner').classList.remove('show');
updateWorld();applyTime();
if(loadSave())$('btnCont').style.display='block';
(function flakes(){const f=$('flakes');for(let i=0;i<40;i++){const s=document.createElement('div');s.className='flake';s.textContent='❄';s.style.left=Math.random()*100+'%';s.style.fontSize=(8+Math.random()*14)+'px';s.style.animationDuration=(5+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';f.appendChild(s);}})();
function begin(){started=true;$('title').style.display='none';ac();music.start();}
function newGame(){
  if(MG.on)MG.exit(true);
  if(flight.on){flight.on=false;flySleigh.visible=false;}player.ride=null;player.act=null;
  S=freshState();try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  placeSleigh(SLEIGH_PAD.slice());setMap(maps[START.map],START.x,START.y,START.dir);updateWorld();applyTime();save();
  setTimeout(()=>say(["Good morning, Pip!","You are a little elf.","You live in Jingle Hollow.",isTouch?"Use the arrows to walk. Press A to talk. Press B to see your quests.":"Use the arrow keys to walk. Press SPACE to talk. Press X to see your quests.","Look at your BAG to see your things and clothes.","Go outside. Find Mayor Holly by the big tree."]),300);
}
$('btnNew').onclick=()=>{begin();newGame();};
$('btnCont').onclick=()=>{const l=loadSave(),c=cloudData;const s=!l?c:!c?l:((c.t||0)>(l.t||0)?c:l);begin();if(!s){newGame();return;}applySave(s);};
cloudInit();
loop();
